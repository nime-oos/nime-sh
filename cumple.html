<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0508">
<title>Feliz cumpleaños, Javiera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Great+Vibes&family=Montserrat:wght@600;800&family=Playfair+Display:ital,wght@1,400;1,700&display=swap">
<link rel="stylesheet" href="css/cumple.css">
</head>
<body>
<div id="marco">
  <canvas id="lienzo" width="1080" height="1920"></canvas>
  <div id="portada">
    <div class="cp-tarjeta">
      <button id="cp-ver" class="cp-boton" disabled>Cargando fotos…</button>
      <button id="cp-grabar" class="cp-boton cp-sec" disabled>⏺ Grabar video para TikTok</button>
      <a id="cp-descargar" class="cp-boton cp-sec" hidden>⬇ Descargar el video</a>
      <p id="cp-aviso">Toca el video para pausarlo. Para subirlo a TikTok, “Grabar video” crea el archivo 1080×1920 con la música.</p>
    </div>
  </div>
  <div id="cp-pausa" hidden>▶</div>
</div>
<audio id="musica" src="musica/Melendi - Tu jardín con enanitos (audio).mp3" preload="auto"></audio>
<script src="js/letra-cumple.js" defer></script>
<script src="js/cumple.js" defer></script>
</body>
</html>
